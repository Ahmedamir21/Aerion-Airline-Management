{% extends "base.html" %}
{% block title %}Add Route{% endblock %}
{% block content %}<section class="section-panel"><h1>Add Route</h1><form method="post">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label for="departure_airport">Departure airport</label><select id="departure_airport" name="departure_airport" required>{% for airport in airports %}<option value="{{ airport.Code }}">{{ airport.Code }} - {{ airport.Name }}</option>{% endfor %}</select><label for="arrival_airport">Arrival airport</label><select id="arrival_airport" name="arrival_airport" required>{% for airport in airports %}<option value="{{ airport.Code }}">{{ airport.Code }} - {{ airport.Name }}</option>{% endfor %}</select><label for="distance">Distance</label><input id="distance" name="distance" type="number" min="1" required><label for="base_fare">Base fare</label><input id="base_fare" name="base_fare" type="number" min="0.01" step="0.01" required><button type="submit" class="btn-primary">Add route</button></form></section>{% endblock %}
